name: Release Readiness Pipeline

on:
  push:
    branches: [main, investigation/release-readiness]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run Syntax Check
        run: |
          python -m py_compile app/app.py app/test_app.py

      - name: Run Unit Tests
        run: |
          python -m pytest app/test_app.py -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: false
          tags: checkout-api:v2.4

  production-deployment:
    name: Production Deployment
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Production Configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: |
          test -n "$DATABASE_URL" || (echo "DATABASE_URL missing" && exit 1)
          test -n "$REDIS_URL" || (echo "REDIS_URL missing" && exit 1)
          echo "Production configuration verified."